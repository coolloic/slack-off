# Every pull request and every push to main: type-check, unit tests and the public-content check.
# Runs with a read-only token and no secrets, so pull requests from forks are safe to run.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS: the command sandbox (sandbox-exec) the unit tests exercise exists only there
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4 # the version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:public
      # the acceptance-sandbox unit tests launch headless Chromium through Playwright
      - run: pnpm exec playwright install chromium
      - name: diagnostic (temporary) - does ps -E show a process environment here?
        run: |
          csrutil status || true
          env -i TMPDIR=/tmp/probe-marker-xyz /bin/sleep 30 & p=$!; sleep 1
          ps -E -ww -o pid=,command= -p $p; kill $p
      - run: pnpm test
