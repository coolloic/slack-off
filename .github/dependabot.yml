# Dependency updates as pull requests. Each one runs CI like any other pull request and is merged by a maintainer,
# never automatically.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspaces are read from pnpm-lock.yaml
    directory: /
    schedule:
      interval: daily
      time: "04:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
